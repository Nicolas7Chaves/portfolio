version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 8 needs Node 20.19+; Amplify's default image can be older.
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
